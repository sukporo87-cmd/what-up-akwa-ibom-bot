<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16121f">
<meta name="robots" content="noindex">
<title>What's Up Trivia TV — Sign in on the TV</title>
<link rel="icon" href="/media/icon-192.png" sizes="192x192" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  WUT TV, phase 4: signing in on a TV. Opened from the QR code the TV shows.
  The player approves with the account they are already signed in to on this
  phone; nothing is typed on the TV, ever.

  What the TV gets: the account's username, and Solo points credited to it.
  Nothing else. From app 0.11.0 the TV stays signed in until someone chooses
  Sign out on it, or someone else signs in there.

  No markup is ever built from data: every piece of text is set with
  textContent.
-->
<style>
:root{
  --night:#16121f; --slate:#241d33; --raise:#2e2540; --line:#3b3150;
  --brass:#e8b64c; --mint:#35d39a; --ember:#ff6b5b;
  --paper:#f2eee9; --mute:#9b8fb0;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --pad:clamp(16px,5vw,28px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.45;min-height:100dvh;display:flex;flex-direction:column;
  border-top:6px solid var(--brass)}
main{flex:1;display:flex;flex-direction:column;padding:var(--pad);padding-bottom:calc(var(--pad) + env(safe-area-inset-bottom));
  max-width:520px;width:100%;margin:0 auto;gap:18px}
h1{font-family:var(--display);font-weight:800;margin:0;line-height:1.08;letter-spacing:-.01em;font-size:clamp(28px,8vw,38px)}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:14px}
.code{font-family:var(--display);font-weight:600;letter-spacing:.12em;color:var(--brass)}
.card{background:var(--slate);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.who{font-family:var(--display);font-weight:800;font-size:26px;color:var(--brass);word-break:break-word}
.ok{color:var(--mint)}
.bad{color:var(--ember)}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:16px 18px;cursor:pointer;
  background:var(--raise);color:var(--paper);min-height:54px;width:100%;text-align:center;text-decoration:none;display:block}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.go,a.btn.go{background:var(--brass);color:var(--night);font-size:18px}
button.quiet{background:transparent;border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px}
.brand img{width:34px;height:34px;border-radius:9px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(function(){
'use strict';

var CODE = (location.pathname.split('/').pop() || '').toUpperCase();
var S = { screen: 'loading', pairing: null, account: null, offset: 0, busy: false, error: '', result: null };

var WHY = {
  pair_expired: 'This code has expired. On the TV, choose Sign in again for a new one.',
  pair_used: 'This code has already been used. On the TV, choose Sign in again for a new one.',
  not_signed_in: "You're not signed in on this phone. Sign in, then come back to this page.",
  scoped_session: 'That sign-in only works for a challenge. Sign in normally, then come back.',
  account_unavailable: "This account can't sign in on a TV.",
  profile_incomplete: 'Finish setting up your account first, then come back to this page.',
  device_blocked: "This TV can't be signed in to.",
  too_many_attempts: 'Too many tries. Wait a few minutes, then try again.',
  busy: 'One moment, then try again.',
  offline: 'No connection. Check your signal and try again.',
  server_error: 'Something went wrong. Try again.'
};
function why(r){ return WHY[r] || 'That did not work. Try again.'; }

function h(tag, attrs, kids){
  var el = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (k === 'text') el.textContent = attrs[k];
    else if (k === 'onclick') el.addEventListener('click', attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

function api(method, path){
  return fetch(path, { method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                       body: method === 'POST' ? '{}' : undefined })
    .then(function(r){ return r.json().catch(function(){ return { success: false, reason: 'server_error' }; }); })
    .catch(function(){ return { success: false, reason: 'offline' }; });
}

function load(){
  if (!/^[A-Z0-9]{8}$/.test(CODE)){ S.screen = 'gone'; S.error = why('pair_expired'); return render(); }
  return Promise.all([
    api('GET', '/tv/pair/' + CODE),
    fetch('/web/auth/me', { credentials: 'same-origin' }).then(function(r){ return r.json(); }).catch(function(){ return null; })
  ]).then(function(out){
    var p = out[0], me = out[1];
    S.account = me && me.authenticated && me.user ? me.user : null;
    if (!p.success){ S.screen = 'gone'; S.error = why(p.reason); return render(); }
    S.pairing = p;
    S.offset = (p.serverNow || Date.now()) - Date.now();
    if (p.state === 'approved'){ S.screen = 'gone'; S.error = why('pair_used'); }
    else if (p.state === 'denied'){ S.screen = 'gone'; S.error = 'Cancelled. Nothing was signed in.'; }
    else S.screen = S.account ? 'confirm' : 'signin';
    render();
  });
}

function approve(){
  if (S.busy) return;
  S.busy = true; S.error = ''; render();
  api('POST', '/tv/pair/' + CODE + '/approve').then(function(j){
    S.busy = false;
    if (j.success){ S.screen = 'done'; S.result = j; }
    else if (j.reason === 'not_signed_in'){ S.account = null; S.screen = 'signin'; S.error = why(j.reason); }
    else if (j.reason === 'pair_expired' || j.reason === 'pair_used'){ S.screen = 'gone'; S.error = why(j.reason); }
    else S.error = why(j.reason);
    render();
  });
}

function deny(){
  if (S.busy) return;
  S.busy = true; render();
  api('POST', '/tv/pair/' + CODE + '/deny').then(function(){
    S.busy = false; S.screen = 'gone'; S.error = 'Cancelled. Nothing was signed in.'; render();
  });
}

// Signing in happens in another tab. Coming back here checks again.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && S.screen === 'signin') load();
});

function left(){
  if (!S.pairing || !S.pairing.expiresAt) return '';
  var ms = S.pairing.expiresAt - (Date.now() + S.offset);
  if (ms <= 0) return 'This code has expired.';
  var s = Math.ceil(ms / 1000);
  return 'This code works for ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + ' more.';
}

function render(){
  var app = document.getElementById('app');
  while (app.firstChild) app.removeChild(app.firstChild);
  var out = [ h('div', { class: 'brand' }, [ h('img', { src: '/media/icon-192.png', alt: '' }), "What's Up Trivia TV" ]) ];

  if (S.screen === 'loading'){
    out.push(h('p', { class: 'mute', text: 'One moment…' }));
  } else if (S.screen === 'gone'){
    out.push(h('h1', { text: 'Sign in on the TV' }));
    out.push(h('p', { class: 'bad', text: S.error }));
  } else if (S.screen === 'signin'){
    out.push(h('h1', { text: 'Sign in on the TV' }));
    out.push(h('p', { text: 'First, sign in to your What’s Up Trivia account on this phone.' }));
    out.push(h('a', { class: 'btn go', href: '/', target: '_blank', rel: 'noopener', text: 'Sign in' }));
    out.push(h('p', { class: 'mute small', text: 'Then come back to this page.' }));
    if (S.error) out.push(h('p', { class: 'bad small', text: S.error }));
    out.push(h('p', { class: 'mute small', id: 'left', text: left() }));
  } else if (S.screen === 'confirm'){
    var p = S.pairing;
    out.push(h('h1', { text: 'Sign in on the TV?' }));
    out.push(h('div', { class: 'card' }, [
      h('p', { class: 'mute small', text: 'You’ll be signed in as' }),
      h('div', { class: 'who', text: S.account.username || 'your account' }),
      p.tvLabel ? h('p', { class: 'mute small', text: 'On: ' + p.tvLabel }) : null,
      p.carryPoints ? h('p', { class: 'ok', text: p.carryPoints + ' points from the game just played on this TV will move to your account.' }) : null
    ]));
    out.push(h('p', { class: 'small', text: 'Only do this if you’re in front of the TV now. Your Solo points will count on the leaderboard.' }));
    out.push(h('p', { class: 'mute small', text: 'You stay signed in on that TV until you choose Sign out on it, or someone else signs in there. Only sign in on a TV you trust.' }));
    out.push(h('button', { class: 'go', disabled: S.busy, onclick: approve, text: S.busy ? 'Signing in…' : 'Sign in on the TV' }));
    out.push(h('button', { class: 'quiet', disabled: S.busy, onclick: deny, text: 'Not me, cancel' }));
    if (S.error) out.push(h('p', { class: 'bad small', text: S.error }));
    out.push(h('p', { class: 'mute small', id: 'left', text: left() }));
  } else if (S.screen === 'done'){
    var r = S.result || {};
    out.push(h('h1', { text: 'Done' }));
    out.push(h('p', { class: 'ok', text: 'The TV is signed in as ' + (r.username || 'you') + '.' }));
    if (r.carried) out.push(h('p', { text: r.carried + ' points moved to your account.' }));
    out.push(h('p', { class: 'mute small', text: 'You can put your phone away. Sign out on the TV when you’re done.' }));
  }
  out.forEach(function(el){ app.appendChild(el); });
}

render();
load();
// Only the countdown changes each second: re-drawing the buttons could eat a tap.
setInterval(function(){ var el = document.getElementById('left'); if (el) el.textContent = left(); }, 1000);
})();
</script>
</body>
</html>
