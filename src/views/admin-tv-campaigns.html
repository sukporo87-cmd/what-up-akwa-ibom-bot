<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📣 Branded parties | WUT TV</title>
<!--
  WUT TV, phase 7, step 1: branded parties. Served at /admin/tv/campaigns,
  linked from the WUT TV page.

  A brand pays What's Up Trivia upfront to run a sponsored Party on chosen
  TVs, or on every TV in chosen states, for a set period. This page sets the
  campaign up: the brand, when and where it runs, its question category, its
  prize rules and limits, the terms players agree to and the details they
  share, the artwork (uploaded straight to Cloudinary and approved here), and
  the money the brand has paid in (Super Admin and Finance Officer only).
  Publishing is refused, with what is missing, until everything is ready.
  Nothing set here is shown on a TV until step 2.

  Times are typed and shown in Lagos time. Every value from the server is
  escaped with esc() before it is placed in the page.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* White, in sponsor teal and coral: its own colours, not the WUT TV page's purple. */
  :root {
    --bg: #fbfdfd; --surface: #ffffff; --surface2: #f1f9f8; --border: #d6ecea; --line: #e7f3f2;
    --text: #0f2a2a; --dim: #5d7676; --teal: #0e7c7b; --teal-ink: #095857; --teal-soft: #dff2f1;
    --coral: #ff6b4a; --coral-soft: #ffe9e3; --green: #11865c; --green-soft: #def5ea;
    --red: #d93a4a; --red-soft: #fde7ea; --amber: #a86a00; --amber-soft: #fff1d4; --blue: #2457d6; --blue-soft: #e6eeff;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--teal); }
  .topbar { background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 2px 0 var(--coral);
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: var(--teal); }
  .topbar h1 span { color: var(--coral); }
  .topbar .back { font-size: 13px; font-weight: 600; text-decoration: none; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 22px 100px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(14, 124, 123, .05); }
  .card h2 { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; color: var(--teal-ink); margin-bottom: 4px; }
  .hint { font-size: 13px; color: var(--dim); margin-bottom: 14px; line-height: 1.55; }
  .hint b { color: var(--text); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
  @media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } .topbar { padding: 14px 16px; } .container { padding: 18px 14px 90px; } }
  .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
  .field .sub { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.45; }
  .field input[type=text], .field input[type=number], .field input[type=url], .field input[type=date], .field input[type=datetime-local],
  .field select, .field textarea {
    width: 100%; background: #fff; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    font: inherit; font-size: 14px; }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
  .field input:disabled, .field select:disabled, .field textarea:disabled { background: #f6f8f8; color: var(--dim); }
  .colour { display: flex; gap: 8px; align-items: center; }
  .colour input[type=color] { width: 44px; height: 38px; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 2px; cursor: pointer; }

  .btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 10px; padding: 8px 14px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.primary:hover { background: var(--teal-ink); color: #fff; }
  .btn.coral { background: var(--coral); color: #fff; border-color: var(--coral); }
  .btn.coral:hover { filter: brightness(.95); color: #fff; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .saved { font-size: 12.5px; color: var(--green); font-weight: 600; }
  .err { font-size: 13px; color: var(--red); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim);
    padding: 8px 10px; border-bottom: 2px solid var(--line); font-weight: 600; white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .dim { color: var(--dim); font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: .02em; white-space: nowrap; }
  .pill.draft { background: #eef1f1; color: var(--dim); }
  .pill.scheduled { background: var(--blue-soft); color: var(--blue); }
  .pill.live { background: var(--green-soft); color: var(--green); }
  .pill.paused { background: var(--amber-soft); color: var(--amber); }
  .pill.finished, .pill.ended { background: #eef1f1; color: var(--dim); }
  .pill.venue { background: var(--teal-soft); color: var(--teal-ink); }
  .pill.warn { background: var(--amber-soft); color: var(--amber); }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.coral { background: var(--coral-soft); color: #b2381c; }
  .clickrow { cursor: pointer; }
  .clickrow:hover td { background: var(--surface2); }

  .opts label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 5px 0; cursor: pointer; }
  .opts input { accent-color: var(--teal); margin-top: 2px; }
  .states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 14px; }
  @media (max-width: 760px) { .states { grid-template-columns: repeat(2, 1fr); } }
  .tvlist { max-height: 340px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
  .reach { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }

  .checklist li { list-style: none; padding: 6px 0; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--line); }
  .checklist li:last-child { border-bottom: 0; }
  .tick { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  .tick.y { background: var(--green-soft); color: var(--green); }
  .tick.n { background: var(--red-soft); color: var(--red); }
  .tick.w { background: var(--amber-soft); color: var(--amber); }

  .art { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .art:last-child { border-bottom: 0; }
  @media (max-width: 760px) { .art { grid-template-columns: 1fr; } }
  .art .pic { width: 220px; aspect-ratio: 16/9; border-radius: 10px; border: 1px dashed var(--border); display: flex; align-items: center;
    justify-content: center; overflow: hidden; background: repeating-conic-gradient(#f2f6f6 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .art .pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .art .pic .none { font-size: 12px; color: var(--dim); }

  .money { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 760px) { .money { grid-template-columns: repeat(2, 1fr); } }
  .money div { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .money b { display: block; font-family: 'Fredoka', sans-serif; font-size: 22px; }
  .money span { font-size: 12px; color: var(--dim); }

  .bar { position: sticky; top: 46px; z-index: 30; background: rgba(251, 253, 253, .96); backdrop-filter: blur(4px);
    border-bottom: 1px solid var(--border); margin: -24px -22px 18px; padding: 12px 22px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar h2 { font-family: 'Fredoka', sans-serif; font-size: 20px; color: var(--teal-ink); margin-right: auto; }
  @media (max-width: 760px) { .bar { margin: -18px -14px 18px; padding: 10px 14px; } }
  .empty { padding: 18px; text-align: center; color: var(--dim); font-size: 13.5px; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.55; margin-bottom: 14px; }
  .banner.warn { background: var(--amber-soft); border: 1px solid #f0d189; color: #6b4600; }
  .banner.info { background: var(--teal-soft); border: 1px solid #b9e2df; color: var(--teal-ink); }
</style>
</head>
<body>
<div class="topbar">
  <h1>📣 Branded <span>parties</span></h1>
  <a class="back" href="/admin/tv">← WUT TV</a>
</div>
<div class="container" id="app"><div class="empty">Loading…</div></div>

<script>
'use strict';
let sessionToken = null;
try { sessionToken = localStorage.getItem('adminSessionToken'); } catch (e) {}
if (!sessionToken) window.location.href = '/admin';

async function api(path, options = {}) {
  const r = await fetch('/admin/tv/api' + path, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + sessionToken, 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (r.status === 401) { try { localStorage.removeItem('adminSessionToken'); } catch (e) {} window.location.href = '/admin'; return null; }
  return r.json().catch(() => ({ success: false, error: 'The server sent something unexpected' }));
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const naira = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const pretty = s => String(s || '').replace(/(^|[\s-])\S/g, m => m.toUpperCase());
function lagos(t, withTime = true) {
  if (!t) return '—';
  const o = { timeZone: 'Africa/Lagos', day: 'numeric', month: 'short', year: 'numeric' };
  if (withTime) { o.hour = 'numeric'; o.minute = '2-digit'; }
  try { return new Date(t).toLocaleString('en-GB', o); } catch (e) { return '—'; }
}
// A moment -> what a datetime-local box shows, in Lagos time (UTC+1 all year).
function lagosInput(t) { return t ? new Date(new Date(t).getTime() + 3600e3).toISOString().slice(0, 16) : ''; }
const STATE_LABEL = { draft: 'Draft', scheduled: 'Scheduled', live: 'Live', paused: 'Paused', finished: 'Finished', ended: 'Ended' };
const BASIS = { none: 'No prize', per_game: 'A prize per game', per_tv_day: 'A prize per TV per day', leaderboard: 'A leaderboard' };
const PERIOD = { campaign: 'the whole campaign', week: 'each week', day: 'each day' };
const FIELD_LABEL = { username: 'Username', city: 'City', full_name: 'Full name', email: 'Email address', phone: 'Phone number' };
const pill = s => '<span class="pill ' + esc(s) + '">' + esc(STATE_LABEL[s] || s) + '</span>';

let OPTIONS = null;   // TVs, states, categories, artwork sizes, whether this admin can record money
let C = null;         // the campaign being edited

window.addEventListener('hashchange', route);
route();

async function route() {
  if (!OPTIONS) {
    const o = await api('/campaigns/options');
    if (!o) return;
    if (!o.success) { document.getElementById('app').innerHTML = '<div class="card"><div class="err">' + esc(o.error) + '</div></div>'; return; }
    OPTIONS = o;
  }
  const id = Number((location.hash.match(/^#(\d+)$/) || [])[1]);
  if (id) return openCampaign(id);
  return showList();
}

// ============================================================
// THE LIST
// ============================================================
async function showList() {
  C = null;
  const app = document.getElementById('app');
  const j = await api('/campaigns');
  if (!j) return;
  if (!j.success) { app.innerHTML = '<div class="card"><div class="err">' + esc(j.error) + '</div></div>'; return; }
  const rows = j.campaigns;
  app.innerHTML =
    '<div class="card"><h2>New campaign</h2>' +
    '<div class="hint">A branded party runs alongside everyone\'s Party: the brand is the host and never plays, a player in the room becomes co-host, and prizes come from what the brand has paid in. Start with the names; everything else is set on the next screen and can wait until you have it. <b>Nothing reaches a TV yet</b> (that comes with the next update).</div>' +
    '<div class="grid3"><div class="field"><label for="nName">Campaign name</label><input type="text" id="nName" maxlength="60" placeholder="e.g. Back to School Quiz"></div>' +
    '<div class="field"><label for="nBrand">Brand</label><input type="text" id="nBrand" maxlength="40" placeholder="e.g. Indomie"></div>' +
    '<div class="field"><label>&nbsp;</label><button class="btn primary" id="nGo">Create draft</button> <span class="err" id="nErr"></span></div></div></div>' +
    '<div class="card"><h2>Campaigns</h2><div class="hint">Pinned campaigns are shown first, on this page and on the TVs.</div>' +
    (rows.length ? '<div class="scroll"><table><thead><tr><th>Campaign</th><th>State</th><th>Runs</th><th>Where</th><th>Prize</th><th class="num">Paid in</th></tr></thead><tbody>' +
      rows.map(c => '<tr class="clickrow" data-id="' + esc(c.id) + '"><td>' + (c.pinned ? '📌 ' : '') + '<b>' + esc(c.name) + '</b><div class="dim">' + esc(c.brandName) + '</div></td>' +
        '<td>' + pill(c.state) + '</td><td>' + esc(lagos(c.startsAt, false)) + ' – ' + esc(lagos(c.endsAt, false)) + '</td>' +
        '<td>' + esc(c.tvCount) + ' TV' + (c.tvCount === 1 ? '' : 's') + (c.regions.length ? '<div class="dim">' + esc(c.regions.join(', ')) + '</div>' : '') + '</td>' +
        '<td>' + esc(BASIS[c.prizeBasis] || '') + (c.prizeBasis !== 'none' ? '<div class="dim">' + (c.prizeType === 'cash' ? 'cash' : 'an item') + '</div>' : '') + '</td>' +
        '<td class="num">' + esc(naira(c.funded)) + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty">No campaigns yet.</div>') + '</div>';
  app.querySelectorAll('.clickrow').forEach(tr => tr.addEventListener('click', () => { location.hash = '#' + tr.dataset.id; }));
  document.getElementById('nGo').addEventListener('click', async () => {
    const b = document.getElementById('nGo');
    b.disabled = true;
    const r = await api('/campaigns', { method: 'POST', body: JSON.stringify({ name: document.getElementById('nName').value, brandName: document.getElementById('nBrand').value }) });
    b.disabled = false;
    if (!r) return;
    if (!r.success) { document.getElementById('nErr').textContent = r.error; return; }
    location.hash = '#' + r.id;
  });
}

// ============================================================
// ONE CAMPAIGN
// ============================================================
async function openCampaign(id) {
  const j = await api('/campaigns/' + id);
  if (!j) return;
  if (!j.success) { document.getElementById('app').innerHTML = '<div class="card"><div class="err">' + esc(j.error) + '</div><p style="margin-top:10px"><a href="#">← All campaigns</a></p></div>'; return; }
  C = j.campaign;
  render();
}

async function reload() { const j = await api('/campaigns/' + C.id); if (j && j.success) { C = j.campaign; render(); } }

function render() {
  const app = document.getElementById('app');
  const ended = C.status === 'ended';
  const dis = ended ? ' disabled' : '';
  app.innerHTML = actionBar() +
    (ended ? '<div class="banner info">This campaign has ended. It can no longer be changed, except its notes.</div>' : '') +
    (C.status !== 'draft' && !ended ? '<div class="banner warn">This campaign is published. Changes apply to new games. A change to the terms, or to the details players share, makes a new version of the terms (now version ' + esc(C.termsVersion) + '), which players will be asked to accept again.</div>' : '') +
    checklistCard() + brandCard(dis) + whenWhereCard(dis) + questionsCard(dis) + prizesCard(dis) + termsCard(dis) + artCard(ended) + moneyCard() + notesCard();
  wire();
}

function actionBar() {
  const b = [];
  if (C.status === 'draft') b.push('<button class="btn coral" data-act="publish"' + (C.publishable ? '' : ' disabled title="Not ready yet: see the checklist"') + '>Publish</button>');
  if (C.status === 'published') b.push('<button class="btn" data-act="pause">Pause</button>');
  if (C.status === 'paused') b.push('<button class="btn primary" data-act="resume">Resume</button>');
  if (C.status === 'published' || C.status === 'paused') b.push('<button class="btn danger" data-act="end">End now</button>');
  if (C.status !== 'ended') b.push('<button class="btn" data-act="pin">' + (C.pinned ? 'Unpin' : '📌 Pin') + '</button>');
  if (C.status === 'draft') b.push('<button class="btn danger" data-act="delete">Delete draft</button>');
  return '<div class="bar"><a href="#" class="btn">← All</a><h2>' + (C.pinned ? '📌 ' : '') + esc(C.name) + ' ' + pill(C.state) + '</h2>' + b.join('') +
    '<span class="err" id="actErr"></span></div>';
}

function checklistCard() {
  if (C.status !== 'draft') return '';
  return '<div class="card"><h2>Ready to publish?</h2><div class="hint">Publishing is possible once every line is ticked. An amber line is a reminder, not a block.</div><ul class="checklist">' +
    C.checklist.map(x => '<li><span class="tick ' + (x.ok ? 'y">✓' : x.warning ? 'w">!' : 'n">✕') + '</span><span>' + esc(x.text) + '</span></li>').join('') + '</ul></div>';
}

function brandCard(dis) {
  return '<div class="card" data-section="brand"><h2>The brand</h2><div class="hint">How the campaign is named and coloured on the TV. The offer line and link are shown at the end of each game, if given.</div>' +
    '<div class="grid2">' +
    field('Campaign name', '<input type="text" data-k="name" maxlength="60" value="' + esc(C.name) + '"' + dis + '>') +
    field('Brand', '<input type="text" data-k="brandName" maxlength="40" value="' + esc(C.brandName) + '"' + dis + '>') +
    field('Tagline', '<input type="text" data-k="tagline" maxlength="80" value="' + esc(C.tagline || '') + '"' + dis + '>', 'Up to 80 characters. Shown under the brand in the lobby.') +
    field('Offer line', '<input type="text" data-k="offerText" maxlength="120" value="' + esc(C.offerText || '') + '"' + dis + '>', 'Up to 120 characters, e.g. "20% off at any store this week".') +
    field('Offer link', '<input type="url" data-k="offerUrl" maxlength="300" placeholder="https://" value="' + esc(C.offerUrl || '') + '"' + dis + '>', 'Shown as a QR code at the finish. Must start with https://') +
    '<div class="grid2">' + colourField('Main colour', 'colourMain', C.colourMain, dis) + colourField('Accent colour', 'colourAccent', C.colourAccent, dis) + '</div>' +
    '</div>' + saveRow('brand', dis) + '</div>';
}

function whenWhereCard(dis) {
  const chosen = new Set(C.tvs.map(t => t.id));
  const regions = new Set(C.regions);
  const r = C.reach;
  return '<div class="card" data-section="when"><h2>When and where</h2><div class="hint">Typed and shown in <b>Lagos time</b>. A campaign runs on the TVs you choose by name, and on every TV in the states you tick. A TV\'s state comes from its internet connection, so it is close to city level, not exact.</div>' +
    '<div class="grid2">' +
    field('Starts', '<input type="datetime-local" data-k="startsAt" value="' + esc(lagosInput(C.startsAt)) + '"' + dis + '>') +
    field('Ends', '<input type="datetime-local" data-k="endsAt" value="' + esc(lagosInput(C.endsAt)) + '"' + dis + '>') +
    '</div>' +
    '<div class="field" style="margin-top:14px"><label>States</label><div class="states opts">' +
    OPTIONS.states.map(s => '<label><input type="checkbox" data-state="' + esc(s.state) + '"' + (regions.has(s.state) ? ' checked' : '') + dis + '> ' + esc(s.state) +
      ' <span class="dim">(' + esc(s.tvs) + ')</span></label>').join('') +
    '</div><div class="sub">The number beside each state is the TVs there seen in the last ' + esc(OPTIONS.activeDays) + ' days.</div></div>' +
    '<div class="field" style="margin-top:14px"><label for="tvFilter">TVs chosen by name <span class="dim">(' + esc(chosen.size) + ' chosen)</span></label>' +
    '<input type="text" id="tvFilter" placeholder="Search by name or place"' + dis + '>' +
    '<div class="tvlist opts" id="tvList" style="margin-top:8px">' +
    OPTIONS.tvs.map(t => '<label data-tvrow="' + esc((t.name + ' ' + (t.place || '') + ' ' + (t.tvName || '')).toLowerCase()) + '"><input type="checkbox" data-tv="' + esc(t.id) + '"' +
      (chosen.has(t.id) ? ' checked' : '') + dis + '> <span><b>' + esc(t.name) + '</b> ' + (t.venue ? '<span class="pill venue">venue</span> ' : '') +
      (t.blocked ? '<span class="pill warn">blocked</span> ' : '') +
      '<span class="dim">' + esc(t.place || 'place unknown') + ' · last seen ' + esc(lagos(t.lastSeen, false)) + '</span></span></label>').join('') +
    (OPTIONS.tvs.length ? '' : '<div class="empty">No TVs registered yet.</div>') + '</div></div>' +
    '<div class="reach"><b>Reach today:</b> ' + esc(r.chosen) + ' TV(s) chosen by name, and ' + esc(r.inRegions) + ' TV(s) seen in the last ' + esc(r.activeDays) +
    ' days in the ticked states: <b>' + esc(r.activeTotal) + ' active TV(s)</b> in all. Saved changes update this.</div>' +
    saveRow('when', dis) + '</div>';
}

function questionsCard(dis) {
  const cats = OPTIONS.categories;

// What each section sends. Only its own fields.
function collect(section) {
  const card = document.querySelector('[data-section="' + section + '"]');
  const out = {};
  card.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'radio') { if (el.checked) out[k] = el.value; }
    else if (el.type === 'checkbox') out[k] = el.checked;
    else out[k] = el.value;
  });
  if (section === 'when') out.regions = [...card.querySelectorAll('[data-state]:checked')].map(x => x.dataset.state);
  if (section === 'terms') {
    out.sharedFields = [...card.querySelectorAll('[data-shared]:checked')].map(x => x.dataset.shared);
    out.winnerFields = [...card.querySelectorAll('[data-winner]:checked')].map(x => x.dataset.winner);
  }
  if (section === 'prizes') {
    out.prizeAmount = out.prizeAmount === '' ? null : Number(out.prizeAmount);
    for (const k of ['minPlayers', 'capPerPlayer', 'prizeGamesPerTvDay', 'minAgeToWin']) out[k] = out[k] === '' ? null : Number(out[k]);
    if (out.leaderboardPeriod === '') out.leaderboardPeriod = null;
    out.prizeRanks = out.prizeBasis === 'leaderboard'
      ? [...card.querySelectorAll('[data-rank]')].map(r => {
          const amount = r.querySelector('[data-rk="amount"]').value.trim();
          const item = r.querySelector('[data-rk="item"]').value.trim();
          return amount !== '' ? { amount: Number(amount) } : { item };
        }).filter(r => r.amount !== undefined || r.item)
      : [];
  }
  return out;
}

// Warn BEFORE saving: keeping a category everyone plays today takes it out of their games.
function showCategoryWarning() {
  const box = document.getElementById('catWarn');
  if (!box) return;
  const sel = document.querySelector('[data-k="category"]');
  const pub = document.querySelector('[data-k="categoryPublic"]');
  const cur = OPTIONS.categories.find(c => c.category === sel.value);
  const offeredNow = cur && (cur.offered || (cur.category === C.category && C.categoryPublic));
  box.innerHTML = cur && offeredNow && !pub.checked && !(cur.category === C.category && !C.categoryPublic)
    ? '<div class="banner warn" style="margin-top:12px">' + esc(pretty(cur.category)) + ' is offered on every TV today. Saving with the box above unticked takes it out of everyone\'s games while this campaign exists. Tick the box to keep it for everyone, or add the brand\'s own questions under a new category name.</div>'
    : (cur && !cur.ready ? '<div class="banner warn" style="margin-top:12px">' + esc(pretty(cur.category)) + ' cannot fill a game yet. The campaign can be saved, but not published, until it can.</div>' : '');
}

function showPrizeParts() {
  const card = document.querySelector('[data-section="prizes"]');
  if (!card) return;
  const basis = (card.querySelector('[data-k="prizeBasis"]:checked') || {}).value;
  const type = (card.querySelector('[data-k="prizeType"]:checked') || {}).value;
  document.getElementById('singlePrize').hidden = !(basis === 'per_game' || basis === 'per_tv_day');
  document.getElementById('boardPrize').hidden = basis !== 'leaderboard';
  const single = document.getElementById('singlePrize');
  single.children[0].hidden = type !== 'cash';
  single.children[1].hidden = type !== 'item';
}

function wire() {
  // actions
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
    const act = b.dataset.act;
    const err = document.getElementById('actErr');
    err.textContent = '';
    if (act === 'end' && !confirm('End this campaign now? It cannot be restarted.')) return;
    if (act === 'delete' && !confirm('Delete this draft? Its pictures are deleted too.')) return;
    if (act === 'publish' && !confirm('Publish this campaign? It goes live on its TVs at its start time (from the next update, which shows campaigns on the TVs).')) return;
    b.disabled = true;
    let r;
    if (act === 'pin') r = await api('/campaigns/' + C.id + '/pin', { method: 'PUT', body: JSON.stringify({ pinned: !C.pinned }) });
    else if (act === 'delete') r = await api('/campaigns/' + C.id, { method: 'DELETE' });
    else r = await api('/campaigns/' + C.id + '/' + act, { method: 'POST' });
    b.disabled = false;
    if (!r) return;
    if (!r.success) { err.textContent = r.error; return; }
    if (act === 'delete') { location.hash = ''; return; }
    reload();
  }));

  // section saves
  document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
    const section = b.dataset.save;
    const ok = document.querySelector('[data-ok="' + section + '"]');
    const bad = document.querySelector('[data-bad="' + section + '"]');
    ok.textContent = ''; bad.textContent = '';
    b.disabled = true;
    const body = collect(section);
    let r = await api('/campaigns/' + C.id, { method: 'PUT', body: JSON.stringify(body) });
    if (r && r.success && section === 'when') {
      const ids = [...document.querySelectorAll('[data-tv]:checked')].map(x => Number(x.dataset.tv));
      r = await api('/campaigns/' + C.id + '/tvs', { method: 'PUT', body: JSON.stringify({ tvIds: ids }) });
    }
    b.disabled = false;
    if (!r) return;
    if (!r.success) { bad.textContent = r.error; return; }
    if (section === 'questions') OPTIONS = null;    // which categories are kept may have changed
    if (!OPTIONS) { const o = await api('/campaigns/options'); if (o && o.success) OPTIONS = o; }
    await reload();
    const again = document.querySelector('[data-ok="' + section + '"]');
    if (again) again.textContent = 'Saved' + (r.termsVersionRaised ? ': the terms are now a new version' : '');
  }));

  // colour pickers mirror the hex boxes
  document.querySelectorAll('[data-pick]').forEach(p => {
    const box = document.querySelector('[data-k="' + p.dataset.pick + '"]');
    p.addEventListener('input', () => { box.value = p.value.toUpperCase(); });
    box.addEventListener('input', () => { if (/^#[0-9a-f]{6}$/i.test(box.value)) p.value = box.value; });
  });

  // TV search
  const filter = document.getElementById('tvFilter');
  if (filter) filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    document.querySelectorAll('[data-tvrow]').forEach(l => { l.hidden = q && !l.dataset.tvrow.includes(q); });
  });

  // questions
  document.querySelectorAll('[data-k="category"], [data-k="categoryPublic"]').forEach(x => x.addEventListener('change', showCategoryWarning));
  showCategoryWarning();

  // prizes
  document.querySelectorAll('[data-k="prizeBasis"], [data-k="prizeType"]').forEach(x => x.addEventListener('change', showPrizeParts));
  showPrizeParts();
  const add = document.getElementById('addRank');
  if (add) add.addEventListener('click', () => {
    const box = document.getElementById('ranks');
    if (box.querySelectorAll('[data-rank]').length >= 10) return;
    box.insertAdjacentHTML('beforeend', rankRow(box.querySelectorAll('[data-rank]').length, {}, ''));
    wireRanks();
  });
  wireRanks();

  // artwork
  document.querySelectorAll('[data-upload]').forEach(inp => inp.addEventListener('change', () => upload(inp.dataset.upload, inp.files[0])));
  document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const r = await api('/campaigns/' + C.id + '/art/' + b.dataset.approve + '/approve', { method: 'POST' });
    b.disabled = false;
    if (r && !r.success) { document.querySelector('[data-arterr="' + b.dataset.approve + '"]').textContent = r.error; return; }
    reload();
  }));
  document.querySelectorAll('[data-removeart]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this picture?')) return;
    b.disabled = true;
    const r = await api('/campaigns/' + C.id + '/art/' + b.dataset.removeart, { method: 'DELETE' });
    b.disabled = false;
    if (r && !r.success) { document.querySelector('[data-arterr="' + b.dataset.removeart + '"]').textContent = r.error; return; }
    reload();
  }));

  // money
  const go = document.getElementById('fGo');
  if (go) go.addEventListener('click', async () => {
    const err = document.getElementById('fErr');
    err.textContent = '';
    const amount = Number(document.getElementById('fAmount').value);
    if (!confirm('Record ' + naira(amount) + ' as paid in by ' + C.brandName + '? This cannot be deleted, only corrected.')) return;
    go.disabled = true;
    const r = await api('/campaigns/' + C.id + '/funds', { method: 'POST', body: JSON.stringify({
      amount, reference: document.getElementById('fRef').value, receivedOn: document.getElementById('fDay').value, note: document.getElementById('fNote').value }) });
    go.disabled = false;
    if (!r) return;
    if (!r.success) { err.textContent = r.error; return; }
    reload();
  });
}

function wireRanks() {
  document.querySelectorAll('[data-delrank]').forEach(b => {
    b.onclick = () => {
      const box = document.getElementById('ranks');
      b.closest('[data-rank]').remove();
      box.querySelectorAll('[data-rank]').forEach((r, i) => { r.querySelector('.dim').textContent = 'Place ' + (i + 1); });
    };
  });
}

// Upload straight to Cloudinary with a short-lived signature, then tell the
// server what was uploaded. The server checks it is in this campaign's
// folder and the right shape and size.
async function upload(slot, file) {
  const err = document.querySelector('[data-arterr="' + slot + '"]');
  err.textContent = '';
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { err.textContent = 'Pictures must be under 8 MB'; return; }
  err.textContent = 'Uploading…';
  const sig = await api('/campaigns/' + C.id + '/art/sign', { method: 'POST' });
  if (!sig) return;
  if (!sig.success) { err.textContent = sig.error; return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('api_key', sig.apiKey);
  fd.append('timestamp', sig.timestamp);
  fd.append('signature', sig.signature);
  fd.append('folder', sig.folder);
  let up;
  try {
    const res = await fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(sig.cloudName) + '/image/upload', { method: 'POST', body: fd });
    up = await res.json();
  } catch (e) { err.textContent = 'The upload did not go through. Check the connection and try again.'; return; }
  if (!up || !up.secure_url) { err.textContent = (up && up.error && up.error.message) || 'The upload did not go through'; return; }
  const r = await api('/campaigns/' + C.id + '/art/' + slot, { method: 'PUT', body: JSON.stringify({
    url: up.secure_url, publicId: up.public_id, width: up.width, height: up.height, bytes: up.bytes, format: up.format }) });
  if (!r) return;
  if (!r.success) { err.textContent = r.error; return; }
  reload();
}
</script>
