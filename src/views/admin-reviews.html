<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ Review Moderation | What's Up Trivia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a23;
    --surface2: #22222f;
    --border: #2d2d3d;
    --text: #e4e4ef;
    --text-dim: #8888a0;
    --accent: #ffc233;
    --green: #00d68f;
    --red: #ff3b5c;
    --yellow: #ffc233;
    --blue: #3b82f6;
    --purple: #8b5cf6;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h1 { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--accent); }
  .topbar .links a { color: var(--text-dim); text-decoration: none; font-size: 13px; margin-left: 18px; }
  .topbar .links a:hover { color: var(--text); }

  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }

  /* tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .tab .n { font-family: 'JetBrains Mono', monospace; margin-left: 6px; font-size: 12px; }
  .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(255,194,51,.07); }

  /* review card */
  .rcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 16px;
  }
  .rcard.watchflag { border-color: rgba(255,59,92,.55); }
  .rhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stars { color: var(--yellow); letter-spacing: 2px; font-size: 15px; }
  .stars .off { color: #3a3a4c; }
  .rname { font-weight: 700; font-size: 15px; }
  .rdate { color: var(--text-dim); font-size: 12px; margin-left: auto; font-family: 'JetBrains Mono', monospace; }
  .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 10px; border: 1px solid transparent;
  }
  .b-wa { background: rgba(0,214,143,.12); color: var(--green); border-color: rgba(0,214,143,.4); }
  .b-tg { background: rgba(59,130,246,.12); color: var(--blue); border-color: rgba(59,130,246,.4); }
  .b-web { background: rgba(139,92,246,.12); color: var(--purple); border-color: rgba(139,92,246,.4); }
  .b-ver { background: rgba(0,214,143,.12); color: var(--green); border-color: rgba(0,214,143,.4); }
  .b-feat { background: rgba(255,194,51,.14); color: var(--yellow); border-color: rgba(255,194,51,.45); }
  .b-fraud { background: rgba(255,59,92,.15); color: var(--red); border-color: rgba(255,59,92,.5); }

  .rtitle { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  .rbody { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; }
  .redited { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .redited summary { cursor: pointer; }
  .redited blockquote { margin-top: 6px; padding: 8px 12px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--border); white-space: pre-wrap; }

  /* player context strip */
  .pctx {
    display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px;
    background: var(--bg); border-radius: 10px; font-size: 12.5px; color: var(--text-dim);
  }
  .pctx b { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .pctx .fraud { color: var(--red); font-weight: 700; }
  .pctx .nomatch { color: var(--text-dim); font-style: italic; }

  .meta-tech { margin-top: 8px; font-size: 11px; color: #5c5c72; font-family: 'JetBrains Mono', monospace; word-break: break-all; }

  /* actions */
  .ractions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    border-radius: 9px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn-approve { background: rgba(0,214,143,.14); border-color: rgba(0,214,143,.5); color: var(--green); }
  .btn-reject { background: rgba(255,59,92,.12); border-color: rgba(255,59,92,.45); color: var(--red); }
  .btn-edit { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.45); color: var(--blue); }
  .btn-feature { background: rgba(255,194,51,.12); border-color: rgba(255,194,51,.45); color: var(--yellow); }

  .reject-reason { margin-top: 10px; font-size: 12.5px; color: var(--red); }

  /* edit form */
  .editbox { margin-top: 14px; display: none; }
  .editbox.open { display: block; }
  .editbox label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  .editbox input, .editbox textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
  }
  .editbox textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
  .editbox input:focus, .editbox textarea:focus { outline: none; border-color: var(--blue); }
  .edit-note { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; }

  .empty { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 14.5px; }
  .loading { text-align: center; color: var(--text-dim); padding: 48px 0; }
  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13.5px;
    opacity: 0; transform: translateY(8px); transition: all .3s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: rgba(0,214,143,.5); }
  .toast.err { border-color: rgba(255,59,92,.5); }
</style>
</head>
<body>

<div class="topbar">
  <h1>⭐ Review Moderation</h1>
  <div class="links">
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/content">Site Content</a>
    <a href="/admin/watchlist">Watchlist</a>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-status="pending">Pending <span class="n" id="nPending">–</span></button>
    <button class="tab" data-status="approved">Approved <span class="n" id="nApproved">–</span></button>
    <button class="tab" data-status="rejected">Rejected <span class="n" id="nRejected">–</span></button>
  </div>
  <div id="list"><div class="loading">Loading reviews…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '/admin/api';
let sessionToken = localStorage.getItem('adminSessionToken');
if (!sessionToken) window.location.href = '/admin';

let currentStatus = 'pending';

async function apiCall(endpoint, options = {}) {
  const response = await fetch(`${API_BASE}${endpoint}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${sessionToken}`,
      'Content-Type': 'application/json',
      ...options.headers
    }
  });
  if (response.status === 401) {
    localStorage.removeItem('adminSessionToken');
    window.location.href = '/admin';
    return;
  }
  return response.json();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function stars(n) {
  let out = '';
  for (let i = 1; i <= 5; i++) out += `<span class="${i <= n ? '' : 'off'}">★</span>`;
  return `<span class="stars">${out}</span>`;
}

function platformBadge(p) {
  const cls = p === 'whatsapp' ? 'b-wa' : p === 'telegram' ? 'b-tg' : 'b-web';
  return `<span class="badge ${cls}">${esc(p)}</span>`;
}

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function playerContext(r) {
  if (!r.player) {
    return `<div class="pctx"><span class="nomatch">${
      r.contact_email
        ? 'Email provided but no matching player account — treat as an ordinary (unverified) review.'
        : 'No email provided — cannot verify, and that is normal for WhatsApp/Telegram players.'
    }</span></div>`;
  }
  const p = r.player;
  return `<div class="pctx">
    <span>Matched player: <b>@${esc(p.username)}</b></span>
    <span>Platform: <b>${esc(p.platform || '—')}</b></span>
    <span>Games played: <b>${p.games_played.toLocaleString()}</b></span>
    <span>Total winnings: <b>₦${p.total_winnings.toLocaleString()}</b></span>
    ${p.on_watchlist
      ? '<span class="fraud">⚠️ ON FRAUD WATCHLIST</span>'
      : '<span style="color:var(--green)">Not on watchlist</span>'}
  </div>`;
}

function card(r) {
  const isPending = r.status === 'pending';
  const isApproved = r.status === 'approved';
  return `<div class="rcard ${r.player && r.player.on_watchlist ? 'watchflag' : ''}" id="rc${r.id}">
    <div class="rhead">
      ${stars(r.rating)}
      <span class="rname">${esc(r.display_name)}</span>
      ${platformBadge(r.platform)}
      ${r.verified ? `<span class="badge b-ver">✓ verified</span>` : ''}
      ${r.featured ? `<span class="badge b-feat">★ featured</span>` : ''}
      ${r.player && r.player.on_watchlist ? `<span class="badge b-fraud">watchlist</span>` : ''}
      <span class="rdate">#${r.id} · ${new Date(r.created_at).toLocaleString('en-NG')}</span>
    </div>
    ${r.title ? `<div class="rtitle">${esc(r.title)}</div>` : ''}
    <div class="rbody">${esc(r.body)}</div>
    ${r.original_body ? `<details class="redited"><summary>Edited before approval — view original</summary><blockquote>${esc(r.original_title ? r.original_title + '\n\n' : '')}${esc(r.original_body)}</blockquote></details>` : ''}
    ${r.verified && r.verified_achievement ? `<div class="meta-tech">🏅 ${esc(r.verified_achievement)}</div>` : ''}
    ${playerContext(r)}
    <div class="meta-tech">IP: ${esc(r.submitted_ip || '—')} · UA: ${esc((r.user_agent || '—').slice(0, 110))}</div>
    ${r.status === 'rejected' && r.reject_reason ? `<div class="reject-reason">Rejected: ${esc(r.reject_reason)}</div>` : ''}

    <div class="editbox" id="edit${r.id}">
      <label for="et${r.id}">Title</label>
      <input id="et${r.id}" maxlength="80" value="${esc(r.title || '')}">
      <label for="eb${r.id}">Review text</label>
      <textarea id="eb${r.id}" maxlength="1000">${esc(r.body)}</textarea>
      <div class="edit-note">Light copy-editing only — typos and clarity, not changing what they said. The original text stays on the record.</div>
      <div class="ractions">
        <button class="btn btn-approve" onclick="approve(${r.id}, true)">✓ Save edits &amp; approve</button>
        <button class="btn" onclick="toggleEdit(${r.id})">Cancel</button>
      </div>
    </div>

    <div class="ractions" id="acts${r.id}">
      ${isPending ? `
        <button class="btn btn-approve" onclick="approve(${r.id}, false)">✓ Approve</button>
        <button class="btn btn-edit" onclick="toggleEdit(${r.id})">✎ Edit, then approve</button>
        <button class="btn btn-reject" onclick="reject(${r.id})">✕ Reject</button>
      ` : ''}
      ${isApproved ? `
        <button class="btn btn-feature" onclick="feature(${r.id}, ${!r.featured})">${r.featured ? '★ Unfeature' : '☆ Feature (pin to top)'}</button>
        <button class="btn btn-reject" onclick="reject(${r.id})">✕ Unpublish (reject)</button>
      ` : ''}
      ${r.status === 'rejected' ? `
        <button class="btn btn-approve" onclick="approve(${r.id}, false)">↩ Approve after all</button>
      ` : ''}
    </div>
  </div>`;
}

async function load() {
  document.getElementById('list').innerHTML = '<div class="loading">Loading reviews…</div>';
  const data = await apiCall(`/reviews?status=${currentStatus}&limit=100`);
  if (!data || !data.success) {
    document.getElementById('list').innerHTML = '<div class="empty">Could not load reviews. Refresh to retry.</div>';
    return;
  }
  document.getElementById('nPending').textContent = data.counts.pending;
  document.getElementById('nApproved').textContent = data.counts.approved;
  document.getElementById('nRejected').textContent = data.counts.rejected;

  if (!data.reviews.length) {
    const msg = currentStatus === 'pending'
      ? 'Queue is clear — nothing waiting for moderation. 🎉'
      : `No ${currentStatus} reviews yet.`;
    document.getElementById('list').innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  document.getElementById('list').innerHTML = data.reviews.map(card).join('');
}

function toggleEdit(id) {
  document.getElementById(`edit${id}`).classList.toggle('open');
  document.getElementById(`acts${id}`).style.display =
    document.getElementById(`edit${id}`).classList.contains('open') ? 'none' : 'flex';
}

async function approve(id, withEdits) {
  const payload = {};
  if (withEdits) {
    payload.title = document.getElementById(`et${id}`).value;
    payload.body = document.getElementById(`eb${id}`).value;
    if (payload.body.trim().length < 20) { toast('Review text must be at least 20 characters', false); return; }
  }
  const r = await apiCall(`/reviews/${id}/approve`, { method: 'POST', body: JSON.stringify(payload) });
  if (r && r.success) { toast(`Review #${id} approved — it is now live`); load(); }
  else toast((r && r.error) || 'Approve failed', false);
}

async function reject(id) {
  const reason = prompt('Reason for rejection (recorded, not shown publicly):');
  if (reason === null) return;
  if (!reason.trim()) { toast('A reason is required', false); return; }
  const r = await apiCall(`/reviews/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
  if (r && r.success) { toast(`Review #${id} rejected`); load(); }
  else toast((r && r.error) || 'Reject failed', false);
}

async function feature(id, featured) {
  const r = await apiCall(`/reviews/${id}/feature`, { method: 'POST', body: JSON.stringify({ featured }) });
  if (r && r.success) { toast(featured ? `Review #${id} featured — pinned to top` : `Review #${id} unfeatured`); load(); }
  else toast((r && r.error) || 'Update failed', false);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentStatus = t.dataset.status;
    load();
  });
});

load();
</script>
  <script src="/admin-nav.js"></script>
</body>
</html>
